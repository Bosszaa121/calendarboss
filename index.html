    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && typeof desc.get === 'function' && !desc.set && desc.configurable) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: desc.enumerable,
              get: desc.get,
              set: function () {
                // Ignore third-party extension attempts to overwrite getter-only window.fetch
              },
            });
          }
        } catch (_err) {
          // Ignore if non-configurable
        }

        var isExtensionError = function (filename, stack) {
          var src = String(filename || '') + ' ' + String(stack || '');
          return (
            src.indexOf('chrome-extension://') !== -1 ||
            src.indexOf('moz-extension://') !== -1 ||
            src.indexOf('safari-extension://') !== -1
          );
        };

        window.addEventListener(
          'error',
          function (event) {
            var stack = event && event.error && event.error.stack;
            if (isExtensionError(event && event.filename, stack)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var stack = reason && reason.stack;
            if (isExtensionError('', stack)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
